[package]
name = "quelle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anydoc = "0.2.5"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
encoding_rs = "0.8"
ego-tree = "0.11"
futures-util = "0.3"
percent-encoding = "2"
http-body-util = "0.1"
httpdate = "1"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "query", "form", "gzip", "brotli", "zstd", "deflate", "cookies", "stream"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
